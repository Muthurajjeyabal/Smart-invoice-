        if (q.status === 'sent' || q.status === 'followup') {
          if (q.valid_until) {
            const v = new Date(q.valid_until);
            if (new Date() > v) return 'expired';

          return q.status;

        if (q.status === 'expired') return 'expired';

      const updateQuotationStatus = async (q, newStatus) => {
        if (!q) return;
        try {
          const payload = { status: newStatus, updated_at: new Date().toISOString() };
          if (newStatus === 'followup') {
            const d = new Date(); d.setDate(d.getDate() + 3);
            payload.followup_date = d.toISOString().split('T')[0];
          }
          if (newStatus === 'sent' && !q.followup_date) {
            const d = new Date(); d.setDate(d.getDate() + 3);
            payload.followup_date = d.toISOString().split('T')[0];
          }
          const { error } = await supabase.from('quotations').update(payload).eq('id', q.id);
          if (error) throw error;
          await loadData();
          if (lastQuotation && lastQuotation.id === q.id) {
            setLastQuotation({ ...lastQuotation, ...payload });
          }
        } catch (err) {
          alert('Error: ' + (err.message || err));
        }
      };

      const convertToInvoice = async (q) => {
        if (!q || !business) return;
        if (q.status === 'converted') { alert('Already converted'); return; }
        if (!confirm('Convert ' + q.quotation_number + ' to Invoice?\nCustomer + items will be copied to Smart Invoice.')) return;
        setSaving(true);
        try {
          // Fetch items
          const { data: qItems, error: itemsErr } = await supabase.from('quotation_items').select('*').eq('quotation_id', q.id);
          if (itemsErr) throw itemsErr;
          // Generate invoice number (simple sequential for demo – ideally share with Invoice app)
          const invPrefix = localStorage.getItem('si_prefix') || 'INV';
          const invNumber = invPrefix + '-' + String(Date.now()).slice(-6);
          const invData = {
            business_id: business.id,
            invoice_number: invNumber,
            customer_id: q.customer_id,
            customer_name: q.customer_name,
            customer_mobile: q.customer_mobile,
            customer_gstin: q.customer_gstin,
            invoice_date: new Date().toISOString().split('T')[0],
            subtotal: q.subtotal,
            discount: q.discount,
            taxable_amount: q.taxable_amount,
            cgst: q.cgst,
            sgst: q.sgst,
            igst: q.igst,
            total: q.total,
            amount_paid: 0,
            balance: q.total,
            status: 'pending',
            notes: 'Converted from Quotation ' + q.quotation_number
          };
          const { data: inv, error: invErr } = await supabase.from('invoices').insert(invData).select().single();
          if (invErr) throw invErr;
          if (qItems && qItems.length) {
            const invItems = qItems.map(i => ({
              business_id: business.id,
              invoice_id: inv.id,
              product_id: i.product_id,
              product_name: i.product_name,
              hsn_sac: i.hsn_sac,
              quantity: i.quantity,
              unit_price: i.unit_price,
              gst_percent: i.gst_percent,
              amount: i.amount
            }));
            await supabase.from('invoice_items').insert(invItems);
          }
          await supabase.from('quotations').update({
            status: 'converted',
            converted_invoice_id: inv.id,
            updated_at: new Date().toISOString()
          }).eq('id', q.id);
          await loadData();
          setLastQuotation({ ...q, status: 'converted', converted_invoice_id: inv.id });
          alert('✅ Converted!\nInvoice: ' + invNumber + '\nOpen Smart Invoice to view / send it.');
        } catch (err) {
          alert('Error converting: ' + (err.message || err) + '\n\nMake sure invoices table exists (from Smart Invoice).');
        } finally {
          setSaving(false);
        }
      };

                <option value="ml">മലയാളം · Malayalam</option>
                <option value="bn">বাংলা · Bengali</option>
                <option value="mr">मराठी · Marathi</option>
                <option value="gu">ગુજરાતી · Gujarati</option>
                <option value="pa">ਪੰਜਾਬੀ · Punjabi</option>
              </select>
              <p className="text-[10px] text-slate-400 mt-1.5">Saved for all JMR apps on this device</p>
            </div>

            <a href="invoice.html" className="w-full bg-white rounded-2xl p-4 shadow-card flex items-center gap-3 text-left">
              <div className="w-11 h-11 rounded-xl bg-indigo-50 flex items-center justify-center text-indigo-600 font-bold text-sm">SI</div>
              <div className="flex-1">
                <p className="font-semibold text-slate-900">Smart Invoice</p>
                <p className="text-sm text-slate-500">Switch to invoicing app</p>
              </div>
              <span className="text-slate-400">→</span>
            </a>

            <a href="receipt.html" className="w-full bg-white rounded-2xl p-4 shadow-card flex items-center gap-3 text-left">
              <div className="w-11 h-11 rounded-xl bg-amber-50 flex items-center justify-center text-amber-600 font-bold text-sm">SR</div>
              <div className="flex-1">
                <p className="font-semibold text-slate-900">Smart Receipt</p>
                <p className="text-sm text-slate-500">Switch to receipt app</p>
              </div>
              <span className="text-slate-400">→</span>
            </a>

            <a href="expense.html" className="w-full bg-white rounded-2xl p-4 shadow-card flex items-center gap-3 text-left">
              <div className="w-11 h-11 rounded-xl bg-rose-50 flex items-center justify-center text-rose-600 font-bold text-sm">SE</div>
              <div className="flex-1">
                <p className="font-semibold text-slate-900">Smart Expense</p>
                <p className="text-sm text-slate-500">Expenses & profit</p>
              </div>
              <span className="text-slate-400">→</span>
            </a>
            <a href="index.html" className="w-full bg-white rounded-2xl p-4 shadow-card flex items-center gap-3 text-left">
              <div className="w-11 h-11 rounded-xl bg-slate-100 flex items-center justify-center text-slate-700 font-bold text-xs">JMR</div>
              <div className="flex-1">
                <p className="font-semibold text-slate-900">{t("suiteHome", lang)}</p>
                <p className="text-sm text-slate-500">All apps in one place</p>
              </div>
              <span className="text-slate-400">→</span>
            </a>
            {!staffUser && (
            <button onClick={openProfile} className="w-full bg-white rounded-2xl p-4 shadow-card flex items-center gap-3 text-left">
              <div className="flex-1">
                <p className="font-semibold text-slate-900">Business Profile</p>
                <p className="text-sm text-slate-500">Name, UPI, GSTIN, Address</p>
              </div>
              <IconChevron />
            </button>
            )}
            <button onClick={() => setScreen('templates')} className="w-full bg-white rounded-2xl p-4 shadow-card flex items-center gap-3 text-left">
              <div className="flex-1">
                <p className="font-semibold text-slate-900">Quotation Templates</p>
                <p className="text-sm text-slate-500">{(templates.find(t => t.id === quotationTemplate) || {}).name || 'Classic'}</p>
              </div>
              <IconChevron />
            </button>
            <button onClick={() => setScreen('recurring')} className="w-full bg-white rounded-2xl p-4 shadow-card flex items-center gap-3 text-left">
              <div className="flex-1">
                <p className="font-semibold text-slate-900">Recurring Invoices</p>
                <p className="text-sm text-slate-500">Monthly / quarterly auto-ready</p>
              </div>
              <IconChevron />
            </button>
            {!staffUser && (
              <button onClick={() => setScreen('staff')} className="w-full bg-white rounded-2xl p-4 shadow-card flex items-center gap-3 text-left">
                <div className="flex-1">
                  <p className="font-semibold text-slate-900">Staff Login</p>
                  <p className="text-sm text-slate-500">Add cashier accounts</p>
                </div>
                <IconChevron />
              </button>
            )}
            {!staffUser && (
            <button onClick={() => setScreen('settings')} className="w-full bg-white rounded-2xl p-4 shadow-card flex items-center gap-3 text-left">
              <div className="flex-1">
                <p className="font-semibold text-slate-900">Settings</p>
                <p className="text-sm text-slate-500">Quotation prefix · Overdue days</p>
              </div>
              <IconChevron />
            </button>
            )}
            <button onClick={() => setScreen('reports')} className="w-full bg-white rounded-2xl p-4 shadow-card flex items-center gap-3 text-left">
              <div className="flex-1">
                <p className="font-semibold text-slate-900">Reports</p>
                <p className="text-sm text-slate-500">Sales, paid vs unpaid</p>
              </div>
              <IconChevron />
            </button>
            <div className="bg-white rounded-2xl p-4 shadow-card">
              <p className="text-xs font-semibold text-slate-500 uppercase mb-2">Export</p>
              <div className="flex gap-2">
                <button onClick={exportInvoicesCSV} className="flex-1 bg-slate-900 text-white text-xs font-semibold py-2.5 rounded-xl">Invoices CSV</button>
                <button onClick={exportGSTSummary} className="flex-1 bg-emerald-700 text-white text-xs font-semibold py-2.5 rounded-xl">GST Summary</button>
              </div>
              <p className="text-[10px] text-slate-400 mt-2">Opens in Excel · GSTR-ready columns</p>
            </div>
            <div className="bg-white rounded-2xl p-4 shadow-card">
              <p className="text-xs font-semibold text-slate-500 uppercase mb-1">Install App</p>
              <p className="text-sm text-slate-600">Chrome/Safari → Share → <b>Add to Home Screen</b></p>
              <p className="text-[10px] text-slate-400 mt-1">Works offline for UI · data needs network</p>
            </div>
            <button onClick={loadData} className="w-full bg-white rounded-2xl p-4 shadow-card flex items-center gap-3 text-left">
              <div className="flex-1">
                <p className="font-semibold text-slate-900">Refresh Data</p>
                <p className="text-sm text-slate-500">Reload from server</p>
              </div>
              <IconChevron />
            </button>
            <button onClick={handleLogout} className="w-full bg-white rounded-2xl p-4 shadow-card flex items-center gap-3 text-left">
              <div className="flex-1">
                <p className="font-semibold text-rose-600">Logout</p>
                <p className="text-sm text-slate-500">Sign out</p>
              </div>
              <IconLogout />
            </button>
          </div>
        </div>
      );




      return (
        <div className="max-w-md mx-auto bg-slate-50 min-h-screen relative">
          {screen === 'dashboard' && <Dashboard />}
          {screen === 'create' && <CreateInvoice />}
          {screen === 'pos' && <POS />}
          {screen === 'preview' && <Preview />}
          {screen === 'customers' && !selectedCustomerDetail && <Customers />}
          {screen === 'customers' && selectedCustomerDetail && <CustomerDetail />}
          {screen === 'customer-detail' && <CustomerDetail />}
          {screen === 'products' && <Products />}
          {screen === 'more' && <More />}
          {screen === 'profile' && <Profile />}
          {screen === 'reports' && <Reports />}
          {screen === 'templates' && <Templates />}
          {screen === 'recurring' && <Recurring />}
          {screen === 'settings' && <Settings />}
          {screen === 'staff' && <StaffManager />}
          {['dashboard', 'customers', 'products', 'more'].includes(screen) && <BottomNav />}
          {showAddProduct && <AddProductModal />}
          {showAddCustomer && <AddCustomerModal />}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').catch(function(){});
      });
    }
  </script>
</body>
</html>
